# fly.toml app configuration file generated for automation-eda-backend

app = "automation-eda-backend"
primary_region = "sin" # Singapore region for low latency to Indonesia

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[[mounts]]
  source = "eda_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false # INI PENTING: Mencegah server tertidur
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
